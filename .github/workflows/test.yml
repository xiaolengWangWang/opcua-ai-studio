name: test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet -tags ci ./...
      - run: go test -tags ci -count=1 -timeout 10m ./...
      - name: Build CLI and simulator
        run: go build ./cmd/opcua-cli ./cmd/opcua-sim
